# fly.toml app configuration file generated for opentab-agent
app = 'opentab-agent'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  BROWSER_HEADLESS = 'True'
  ENABLE_TELEGRAM = 'True'
  ENABLE_WHATSAPP = 'False'
  GEMINI_MODEL = 'gemini-1.5-flash'
  GROQ_MODEL = 'qwen/qwen3.8-27b'
  LLM_PROVIDER = 'groq'
  PORT = '10000'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

[[restart]]
  policy = 'always'
