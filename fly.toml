# fly.toml app configuration file for OpenTab
# Docs: https://fly.io/docs/reference/configuration/

app = "opentab-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "10000"
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "llama-3.3-70b-versatile"
  GEMINI_MODEL = "gemini-1.5-flash"
  ENABLE_TELEGRAM = "True"
  ENABLE_WHATSAPP = "True"
  BROWSER_HEADLESS = "True"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
